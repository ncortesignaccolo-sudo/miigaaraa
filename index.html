    const START_DATE = new Date("2025-01-01T00:00:00");

    const lettersData = [
      `Querido amor,\n\nEscribo estas líneas porque a veces las palabras habladas no bastan para contener la inmensidad de lo que siento por ti. Hoy quiero comenzar este viaje de 22 capítulos dedicándote cada pensamiento que guardo en el corazón. Desde que apareciste en mi vida, el mundo tomó una tonalidad distinta, mucho más suave, más brillante y llena de un sentido que antes desconocía.\n\nMe detengo a pensar en cómo era mi rutina antes de conocerte y me doy cuenta de cuánta falta me hacías sin saberlo. Eras la pieza que le faltaba a mi rompecabezas diario, esa pausa de paz en medio de cualquier tormenta. Mirar tus ojos es encontrar un refugio donde no existe el prisa ni el miedo, solo la certeza de que estoy en el lugar correcto.\n\nRecuerdo perfectamente la primera vez que conversamos largo rato. Había algo en tu voz que de inmediato me inspiró una confianza profunda y sincera. Me sentí escuchado, comprendido y apreciado de una forma que nunca antes había experimentado. A partir de ese día, cada detalle tuyo empezó a grabarse en mi memoria con un cariño inmenso.\n\nTu sonrisa se convirtió rápidamente en mi momento favorito de cualquier jornada. No importa qué tan cansado o estresado esté, verte sonreír disipa cualquier sombra. Es como si poseyeras una luz natural que ilumina a todos a tu alrededor, pero sobre todo a mí, que tengo la dicha de amarte.\n\nQuiero que este primer capítulo sea la promesa de que siempre buscaré hacerte feliz. Deseo caminar a tu lado, aprender de ti y ofrecerte lo mejor de mí en cada paso. Eres un ser extraordinario, con un corazón generoso y una esencia hermosa que cuido y valoro infinitamente.\n\nA través de estas cartas quiero dejar constancia de este amor que crece día a día. No hay distancia ni tiempo que apague lo que hemos construido. Gracias por existir, por cruzarte en mi camino y por darme el regalo inestimable de tu presencia. Esto es solo el principio de una larga historia que quiero escribir junto a ti.\n\nCon todo mi amor y mi devoción eterna,\nSiempre tuyo.`,
      `Mi vida entera,\n\nLlegamos al segundo capítulo de este rincón de amor que he creado para ti. Hoy me puse a recordar nuestros momentos más simples, aquellos que no requieren de grandes escenarios pero que se quedan grabados para siempre. Preparar un café juntos, caminar sin rumbo fijo o simplemente estar en silencio compartiendo el mismo espacio.\n\nEs en la sencillez donde descubro la grandeza de nuestro vínculo. No necesitamos grandes pretensiones para ser felices; estar contigo transforma lo cotidiano en algo extraordinario. Me asombra cómo puedes lograr que una tarde común se vuelva inolvidable con una simple mirada o una caricia espontánea.\n\nA veces me pregunto qué hice bien para merecer a alguien tan especial como tú. Posees una paciencia infinita, una dulzura que conmueve y una fuerza interior que no deja de admirarme. En tus abrazos encuentro la calma que el mundo exterior muchas veces me niega. Son mi puerto seguro, mi lugar predilecto.\n\nMe encanta cómo te apasionas por las cosas que te gustan, cómo brillan tus ojos cuando hablas de tus sueños y proyectos. Escucharte hablar es un deleite, y ver cómo te esfuerzas por lo que quieres me llena de un orgullo indescriptible. Quiero ser siempre ese apoyo incondicional en tu vida, quien celebre tus triunfos y te sostenga en los momentos difíciles.\n\nEl amor no es solo una emoción fugaz; es la decisión diaria de cuidar, respetar y construir un futuro mano a mano. Cada día que pasa reafirmo mi decisión de estar a tu lado. Me haces querer ser una mejor persona, no por exigencia, sino por la pura inspiración que emanas.\n\nGracias por enseñarme a amar de una manera tan sana y profunda. Gracias por tus risas compartidas, por tus abrazos reconfortantes y por cada pequeño gesto de cariño. Prometo seguir atesorando cada instante a tu lado como si fuera el tesoro más valioso del universo.\n\nTe amo más de lo que las palabras pueden expresar,\nTu amor incondicional.`,
      `Amor de mi vida,\n\nHoy el capítulo tres nace del agradecimiento profundo que siento por tenerte. A veces la vida nos llena de compromisos, prisas y pendientes, pero bastar pensar en ti para que todo vuelva a tomar su ritmo adecuado. Eres mi ancla, el centro de gravedad que me mantiene firme en este mundo agitado.\n\nQuiero dedicar este espacio a hablar de tu bondad. No solo eres hermoso por fuera, sino que tienes una belleza interior que deslumbra. Tu empatía hacia los demás, la forma en que cuidas a quienes quieres y la ternura con la que tratas los detalles más pequeños demuestran la calidad de ser humano que eres.\n\nMe fascina la complicidad que hemos desarrollado. Esas miradas secretas en medio de una habitación llena de gente, los chistes locales que solo nosotros entendemos y la capacidad de adivinar lo que el otro piensa sin necesidad de articular una sola palabra. Esa conexión es un regalo escaso y maravilloso.\n\nA tu lado he aprendido a valorar el presente. Con frecuencia tendemos a preocuparnos por el futuro o a lamentar el pasado, pero contigo el presente es tan pleno que nada más importa. Vivir el aquí y el ahora a tu lado es una bendición diaria que agradezco al cielo cada mañana.\n\nEspero que al leer estas palabras puedas sentir el abrazo cálido que te envío con el corazón. Quiero que nunca dudes del lugar supremo que ocupas en mi vida. Eres mi prioridad, mi pensamiento recurrente y mi alegría más grande.\n\nSeguiremos construyendo recuerdos inolvidables, superando cualquier obstáculo que se presente y demostrando que cuando el amor es real, no hay nada que lo detenga. Gracias por ser mi compañero, mi confidente y el gran amor de mi existencia.\n\nPor siempre y para siempre,\nQuien te ama con el alma.`,
      `Mi cielo,\n\nEn este cuarto capítulo quiero hablarte de los sueños. Desde que estás conmigo, mis metas para el futuro han adquirido una dimensión mucho más hermosa. Ya no imagino un mañana en el que no estés presente; en cada plano que trazo para mi vida, tú eres la protagonista indiscutible.\n\nMe imagino viajando a tu lado, conociendo lugares lejanos, descubriendo paisajes y acumulando anécdotas que contaremos en el futuro. Pero también me imagino la cotidianeidad de construir un hogar cálido, donde las risas y la paz sean el ingrediente principal de cada jornada.\n\nTu amor me ha dado una seguridad que no sabía que necesitaba. Saber que cuento contigo me da el valor para enfrentar cualquier reto, para arriesgarme y para buscar siempre mi mejor versión. Eres esa luz impulsora que me dice que todo es posible si nos mantenemos unidos.\n\nAdoro la manera en que complementas mis días. Tus bromas cuando necesito sonreír, tus palabras de aliento cuando estoy dudando y tu ternura cuando necesito consuelo. No hay aspecto de mi vida que no se haya visto beneficiado por tu maravillosa influencia.\n\nQuiero prometerte que siempre velaré por tus sueños tanto como por los míos. Tu felicidad es la misma, y ver que alcanzas tus metas me causa una alegría tan profunda como si las hubiera logrado yo mismo. Caminaremos siempre a la par, apoyándonos mutuamente.\n\nGracias por permitirme ser parte de tu historia, por abrirme las puertas de tu corazón y por darme la oportunidad de amarte de esta manera tan pura. Este amor crece sin límites, fortaleciéndose con cada amanecer.\n\nSiempre tuyo en mente y corazón,\nUn abrazo infinito.`,
      `Mi amor verdadero,\n\nLlegamos al capítulo cinco, un hito especial en nuestro camino. Este capítulo marca el cierre de la primera entrega y el umbral de los que vendrán paulatinamente. Quiero aprovecharlo para hablar sobre la confianza y el respeto sobre los que hemos levantado nuestro amor.\n\nAprender a amar a alguien implica aceptar sus virtudes y sus imperfecciones, y yo amo absolutamente todo lo que eres. Me encantan tus manías, tu manera de pensar única y hasta tus días de mal humor, porque forman parte del ser completo del cual me enamoré perdidamente.\n\nCon la firmeza de este sentimiento, sé que podemos atravesar cualquier tormenta. La vida no siempre es sencilla, pero tener la certeza de que estamos en el mismo equipo me llena de una serenidad inquebrantable. Juntos formamos un refugio invulnerable ante cualquier adversidad.\n\nMe deleito pensando en todo lo que aún nos queda por vivir. Cientos de conversaciones nocturnas, miles de risas, celebraciones y momentos compartidos que irán enriqueciendo nuestra historia. Cada día contigo es una página en blanco lista para ser llenada de magia.\n\nEspero que cada tres días, cuando un nuevo capítulo se desbloquee, sientas la misma emoción que siento yo al escribirte. Este proyecto es un reflejo de mi compromiso constante de recordarte lo importante y amada que eres para mí.\n\nNunca olvides que mi corazón te pertenece por completo. Gracias por cada segundo, por cada caricia y por hacerme el ser más afortunado de este planeta al permitirme estar a tu lado.\n\nTe amo con cada fibra de mi ser,\nPara siempre.`,
      `Mi vida amada,\n\nHoy se abre el capítulo seis, el primero de esta nueva etapa en la que la espera hace que cada palabra cobre un valor aún más especial. En estos días he estado pensando mucho en cómo el tiempo adquiere un ritmo distinto cuando estoy esperando volverte a ver o escribirte.\n\nLa distancia o el tiempo no hacen más que avivar esta llama. Cuando te pienso, el mundo parece detenerse por un instante. Recorro en mi mente la forma de tu rostro, la suavidad de tus manos y la manera tan única en que me miras cuando crees que no me doy cuenta.\n\nMe fascina cómo con solo una palabra tuya puedes cambiar el rumbo de mi día. Si me siento preocupado o abrumado, tu voz actúa como un bálsamo instantáneo. Posees el don divino de traer tranquilidad a mi mente agitada con solo recordarme que estás a mi lado.\n\nQuiero reafirmar en este día mi deseo de cuidar este amor con la mayor delicadeza. El amor verdadero no es algo que se da por sentado; es un jardín que requiere riego diario, atención, paciencia y mucho cariño. Y yo estoy dispuesto a dedicar mi vida entera a cuidar nuestro jardín.\n\nGracias por ser ese faro de luz que guía mis pasos en la oscuridad. Gracias por ser mi confidente, mi apoyo y la persona en quien más confío en este mundo. Cada tres días tendrás una nueva confirmación de que este sentimiento sigue intacto y creciendo.\n\nQue tengas un día maravilloso lleno de paz y alegría. Recuerda siempre lo profundamente que te amo y lo presente que estás en cada uno de mis pensamientos.\n\nCon todo el amor del mundo,\nTu amor de siempre.`,
      `Querido corazón,\n\nLlegamos al capítulo siete. Hoy quiero reflexionar sobre cómo nos hemos convertido en un refugio el uno para el otro. En un mundo que a menudo se vuelve caótico y exigente, saber que al final del día existes tú es el premio más grande que puedo recibir.\n\nTu presencia me da una paz que jamás creí posible experimentar. A veces me basta con estar acostado a tu lado, escuchando el ritmo de tu respiración, para sentir que nada malo puede pasar. Es una sensación de plenitud total, de no necesitar nada más en el universo.\n\nAprecio enormemente tu sinceridad y tu transparencia. Con contigo puedo ser completamente yo mismo, sin máscaras, sin filtros y sin temor a ser juzgado. Me has enseñado la verdadera libertad de amar y ser amado en total autenticidad.\n\nMe encanta la forma en que celebramos la vida juntos. Desde las pequeñas victorias cotidianas hasta las grandes metas alcanzadas. Tu alegría siempre multiplica la mía, y tus tristezas me duelen como si fueran propias; esa es la verdadera empatía del amor maduro.\n\nPrometo seguir escuchándote con atención, comprendiéndote en tus momentos difíciles y dándote todo el espacio y el apoyo que necesites para florecer como persona. Tu crecimiento personal es algo que me llena de orgullo e inspiración.\n\nSigue brillando como solo tu sabes hacerlo. Yo estaré siempre aquí, en primera fila, aplaudiendo tus logros y tomándote de la mano en cada paso de este hermoso camino.\n\nTe amo con una fuerza que trasciende las palabras,\nEternamente tuyo.`,
      `Mi amor hermoso,\n\nEn este octavo capítulo quiero hablarte de la gratitud por las pequeñas cosas. Muchas veces buscamos la felicidad en grandes eventos o fechas especiales, pero la verdadera felicidad está tejida con los hilos finos de nuestra rutina diaria.\n\nAgradezco las mañanas en las que puedo enviarte un mensaje deseándote un buen día. Agradezco las tardes de charlas improvisadas y las noches en las que compartimos nuestros pensamientos antes de dormir. Cada uno de esos momentos es una joya inapreciable en mi vida.\n\nMe asombra cómo tu inteligencia y tu sabiduría guían tantas veces nuestras decisiones. Admiro tu capacidad para ver las cosas con claridad, tu criterio firme y la madurez con la que enfrentas los desafíos. Aprendo constantemente de ti y de tu forma de ver el mundo.\n\nNuestra historia se va nutriendo de detalles invisibles para el resto del mundo, pero gigantescos para nosotros. Una canción que nos recuerda a un momento exacto, una frase que solo nos da risa a nosotros dos, o un abrazo que dura unos segundos más de lo normal.\n\nQuiero que sepas que me siento inmensamente afortunado de ser la persona que camina a tu lado. No hay día en que no bendiga el instante en que nuestras vidas se cruzaron. Eres el regalo más hermoso que el destino me ha concedido.\n\nEspero que este capítulo te saque una sonrisa y te recuerde lo inmensamente valiosa que eres para mí. Te amo con un cariño que no conoce límites de tiempo ni espacio.\n\nSiempre tuyo,\nCon el corazón lleno de ti.`,
      `Mi vida querida,\n\nLlegamos al capítulo nueve. Hoy las palabras fluyen para hablarte sobre la armonía que me transmites. Desde que formamos este lazo, he sentido una estabilidad emocional y una calma que antes me eran ajenas.\n\nTenerte en mi vida ha sido como encontrar una brújula en medio de un océano agitado. Me orientas con tu dulzura, me contienes con tu amor y me motivas a dar lo mejor de mí a cada instante. Eres la melodía suave que equilibra todo mi ser.\n\nMe fascina tu sentido del humor. Esas risas compartidas que nos dejan sin aliento son de las cosas que más atesoro. Reír contigo es una medicina para el alma, un recordatorio de que la vida es hermosa cuando se comparte con la persona adecuada.\n\nA través de esta serie de cartas, quiero que guardes un testimonio tangible de este amor. Para que en los días en que puedas sentirte cansada o insegura, leas estas líneas y recuerdes la inmensidad de lo que inspiras en mí.\n\nEres una persona maravillosa, llena de luz, de talento y de una sensibilidad poética que enamora. Nunca te encojas ante nada ni ante nadie, porque naciste para brillar con luz propia.\n\nSigo aquí, amándote cada día más que el anterior, ansioso por todo lo bonito que el destino nos tiene preparado. Eres y serás siempre el amor de mi vida.\n\nUn beso enorme en la distancia,\nTu fiel enamorado.`,
      `Amor de mi alma,\n\nAlcanzamos el capítulo diez, casi la mitad de este recorrido de 22 entregas. Este número redondo me invita a mirar hacia atrás y contemplar todo lo que hemos construido juntos hasta ahora. ¡Qué camino tan maravilloso hemos recorrido!\n\nHemos superado momentos de incertidumbre, hemos aprendido a comunicarnos mejor y hemos consolidado un amor maduro, sano y fuerte. Cada obstáculo superado ha sido un peldaño más en la torre inexpugnable de nuestra relación.\n\nAdoro la forma en que me miras. Hay en tus ojos un brillo de complicidad y ternura que me desarma por completo. Cuando tus ojos se cruzan con los míos, siento que todo lo demás desaparece y que solo existimos tú y yo en nuestro propio universo.\n\nQuiero renovar en este día mis promesas de amor hacia ti. Prometo serte fiel, respetarte profundamente, acompañarte en tus luchas y ser tu refugio seguro en todo momento. Mi compromiso contigo es sincero y nace del rincón más profundo de mi corazón.\n\nGracias por cada detalle, por cada palabra de aliento y por amarme de la forma tan hermosa en que lo haces. Mi vida es inmensamente más rica y feliz gracias a ti.\n\nSigamos escribiendo juntos los capítulos que faltan, no solo en esta web, sino en el libro infinito de nuestras vidas. Te amo con un fervor inolvidable.\n\nCon amor eterno,\nTu compañero de vida.`,
      `Mi cielo adorado,\n\nLlegamos al capítulo once. En esta ocasión quiero escribirte sobre la belleza de nuestra complicidad. Es maravilloso cómo podemos entendernos sin decir una sola palabra, cómo un simple gesto tuyo me basta para saber exactamente qué sientes o qué necesitas.\n\nEsa conexión profunda no se logra fácilmente; es el fruto del interés genuino, de la empatía y del amor constante que nos profesamos. Me siento verdaderamente privilegiado por haber alcanzado ese nivel de intimidad emocional contigo.\n\nMe encanta pensar en todas las cosas que aún nos quedan por descubrir juntos. Nuevos pasatiempos, nuevos destinos, nuevas metas por conquistar. Contigo el futuro no provoca miedo, sino una expectativa emocionante y llena de ilusión.\n\nTu ternura es mi debilidad. La forma en que me acaricias el cabello, cómo me buscas la mano al caminar o cómo me abrazas fuerte al despedirnos son momentos que guardo como tesoros en mi memoria afectiva.\n\nDeseo que este día esté lleno de bendiciones para ti. Que recuerdes que hay alguien que no deja de pensarte, de admirarte y de enviarte las mejores energías en todo momento. Eres el sol de mis días.\n\nTe amo con toda la fuerza de mi alma y la ternura de mi corazón. Gracias por existir y por ser mi todo.\n\nSiempre tuyo,\nTu amor incondicional.`,
      `Mi vida,\n\nCapítulo doce. Hoy la inspiración me lleva a hablarte sobre el crecimiento que he experimentado desde que estás en mi vida. Amar no es solo contemplarse el uno al otro, sino mirar juntos en la misma dirección y ayudarse a crecer.\n\nTú me has impulsado a superar miedos, a asumir nuevos retos y a confiar más en mis capacidades. Tu fe en mí me fortalece cuando dudo, y tu apoyo es el motor que me impulsa a seguir adelante siempre.\n\nAprecio la paciencia con la que me escuchas cuando necesito desahogarme. Tu capacidad para comprender sin juzgar y para ofrecer consejos sabios es una de las virtudes que más admiro de ti. Eres mi mejor consejera y mi amiga más fiel.\n\nNuestro amor es una fortaleza tranquila. No necesita de escándalos ni de demostraciones vacías para el exterior; su verdadera fuerza reside en la certeza interna que ambos compartimos en nuestros corazones.\n\nQuiero seguir caminando a tu lado por todos los senderos que la vida nos presente. Tomados de la mano, con la frente en alta y con la convicción de que juntos somos invencibles.\n\nTe amo más allá de las palabras, más allá del tiempo y de las circunstancias. Eres lo mejor que me ha pasado en la vida.\n\nUn abrazo apretado con toda mi alma,\nEternamente apasionado.`,
      `Querido amor de mi vida,\n\nLlegamos al capítulo trece. A menudo se asocia este número con la suerte, y en verdad no puedo sentirme más afortunado por tenerte en mi vida. Eres mi amuleto de buena suerte, mi bendición constante.\n\nHoy quiero recordar la dulzura de tus palabras. Cada vez que me dices cuánto me quieres, siento un escalofrío hermoso que recorre todo mi cuerpo. Tus palabras de afecto nunca pierden su magia; siguen conmoviéndome como el primer día.\n\nAdmiro la pasión que le pones a todo lo que haces. Ya sea tu trabajo, tus pasatiempos o el cuidado de nuestras relaciones, te entregas al cien por cien con un entusiasmo contagioso. Eres una fuerza de la naturaleza inspiradora.\n\nMe encanta la paz que se respira a tu lado. Contigo no hay necesidad de fingir nada; puedo mostrarme tal como soy, con mis luces y mis sombras, sabiendo que soy aceptado y amado en mi totalidad.\n\nDeseo que al abrir esta carta sientas el calor de mi amor abrazándote. Aunque el tiempo pase y la rutina amenace, siempre me encargaré de mantener viva esta llama que nos une.\n\nGracias por ser mi lugar feliz, mi norte y mi mayor alegría. Te amo con una intensidad que crece día a día sin detenerse.\n\nSiempre a tu lado,\nQuien te adora con locura.`,
      `Mi amor eterno,\n\nCapítulo catorce. Hoy quiero hablarte de la lealtad y el compromiso. En un mundo donde todo parece ser desechable y pasajero, lo que nosotros tenemos es sólido, profundo y duradero.\n\nConstruir una relación verdadera requiere esfuerzo diario, comprensión y la voluntad firme de mantenerse unidos ante cualquier prueba. Estoy enormemente orgulloso de la madurez con la que ambos hemos cuidado este lazo tan sagrado.\n\nTus abrazos son mi medicina. Cuando me rodeo de tus brazos, siento que cualquier problema se vuelve pequeño y manejable. Tienes el don de infundir tranquilidad y seguridad con tu sola cercanía física.\n\nMe encanta cómo planificamos las cosas juntos. Desde una salida el fin de semana hasta proyectos a largo plazo. Trabajar en equipo contigo es una de las experiencias más gratificantes de mi vida.\n\nDeseo que este día recibas toda la luz y la felicidad que mereces. Eres un ser lleno de virtudes, una persona excepcional que merece ser amada con la máxima delicadeza y devoción.\n\nSeguiré escribiendo estos capítulos para ti, recordando siempre la suerte infinita que tengo de ser quien comparte tu vida. Te amo infinitamente.\n\nCon todo mi ser,\nTu amor de siempre.`,
      `Mi cielo dulce,\n\nLlegamos al capítulo quince. Hoy mi corazón quiere detenerse en la ternura de nuestros momentos de intimidad afectiva. Esas conversaciones sinceras a la luz de las velas o antes de quedarnos dormidos.\n\nEn esos momentos de vulnerabilidad compartida es donde se revela la verdadera esencia de nuestro amor. Nos hemos mostrado nuestras heridas, nuestros miedos más profundos y nuestros anhelos más íntimos, creando un puente de confianza indestructible.\n\nAmo la manera en que te ríes de mis ocurrencias, incluso cuando no son graciosas. Tu risa es la música más bella que mis oídos pueden escuchar; alegra mi alma y llena de vida cualquier rincón.\n\nQuiero prometerte que siempre estaré velando por tu bienestar. Si alguna vez te sientes triste, seré tu paño de lágrimas; si te sientes cansada, seré tu descanso; y si te sientes perdida, seré la luz que te guíe de vuelta a casa.\n\nEres mi persona favorita en todo el universo. No existe nadie más con quien prefiera compartir mi tiempo, mis pensamientos y mis sueños. Eres única e insustituible.\n\nRecibe estas palabras como un ramo de flores virtuales enviado directo desde mi corazón al tuyo. Te amo con un amor profundo y sincero.\n\nSiempre tuyo,\nTu compañero eterno.`,
      `Mi amor amado,\n\nCapítulo dieciséis. Hoy me encuentro pensando en la forma en que el tiempo vuela cuando estoy a tu lado, y cómo se desacelera cuando espero el momento de nuestro próximo reencuentro.\n\nEsta dulce espera entre cada capítulo me hace valorar aún más la presencia de tu amor en mi vida. Es un recordatorio constante de que las cosas más hermosas de la vida requieren paciencia y cariño para madurar.\n\nAdmiro tu capacidad para encontrar belleza en los detalles más insignificantes. Me has enseñado a detenerme a mirar un atardecer, a disfrutar del aroma del café por la mañana y a valorar los pequeños milagros cotidianos.\n\nTu sensibilidad artística y humana es un regalo para quienes tenemos la fortuna de conocerte. Llenas de color la vida de todos a tu alrededor, pero de manera muy especial, has pintado la mía con los colores más vivos de la felicidad.\n\nQuiero asegurarte que mi amor por ti no es algo pasajero. Es un sentimiento arraigado en lo más profundo de mi alma, un compromiso que asumo con alegría y devoción cada nuevo día.\n\nGracias por ser el faro que ilumina mi sendero. Sigue caminando con esa elegancia y seguridad que te caracterizan. Te amo con todo mi corazón.\n\nCon devoción total,\nTu amor incondicional.`,
      `Mi tesoro,\n\nAlcanzamos el capítulo diecisiete. Hoy quiero escribir sobre la paz mental que me otorga saber que estamos juntos. En medio del ruido de la vida moderna, nuestra relación es una isla de serenidad.\n\nSaber que al final de la jornada cuento con tu amor, tu comprensión y tus abrazos me da una fuerza incalculable para superar cualquier día difícil. Eres mi refugio contra las inclemencias del mundo exterior.\n\nMe fascina tu mirada penetrante y expresiva. Con solo mirarme puedes comunicarme amor, complicidad, consuelo o picardía. Tus ojos son una ventana abierta a una alma pura y hermosa que adoro con locura.\n\nQuiero agradecerte por la tolerancia y la dulzura con la que tratas mis fallos. Tu amor maduro me enseña a ser mejor persona cada día, no mediante reproches, sino mediante el ejemplo vivo de tu generosidad.\n\nPrometo seguir dando lo mejor de mí para mantener este amor floreciente. Ningún esfuerzo es demasiado grande cuando el objetivo es verte sonreír y saber que te sientes plenamente amada y valorada.\n\nTe envío un beso cargado de toda la pasión y el respeto que siento por ti. Eres y serás siempre el gran amor de mi vida.\n\nSiempre tuyo,\nQuien te ama con toda la fuerza.`,
      `Querida mía,\n\nCapítulo dieciocho. Acercándonos poco a poco al final de esta serie de cartas, me doy cuenta de que 22 capítulos son apenas una breve muestra de todo lo que tengo para decirte y demostrarte.\n\nEl amor verdadero es inagotable; no se acaba con las palabras ni se limita al papel. Se demuestra en las acciones cotidianas, en la lealtad constante y en el deseo genuino de hacerle la vida más ligera y feliz al ser amado.\n\nMe encanta la solidez de nuestros valores compartidos. Respeto, honestidad, libertad y cariño son los cimientos sobre los que descansan nuestros días. Esa afinidad profunda es la garantía de que nuestro lazo perdurará a través de los años.\n\nRecuerdo con emoción cada momento importante que hemos atravesado juntos. Las alegrías desbordantes, las conversaciones profundas y hasta las pequeñas discrepancias que siempre supimos resolver con amor y madurez.\n\nEres una mujer increíble, digna de toda admiración y cariño. Me siento inmensamente orgulloso de caminar de tu mano por la vida y presumir al mundo que soy el dueño de tu corazón.\n\nTe amo con una devoción que no disminuye, sino que se fortalece con cada batir de mi corazón. Gracias por tanto amor.\n\nEternamente enamorado,\nTu fiel compañero.`,
      `Mi vida, mi todo,\n\nLlegamos al capítulo diecinueve. Hoy la reflexión me lleva a valorar la libertad que nos otorgamos mutuamente. Amar verdaderamente no es poseer ni atar; es volar juntos manteniendo la propia individualidad.\n\nMe encanta ver cómo persigues tus metas personales, cómo te desarrollas en tus áreas de interés y cómo mantienes tu propia esencia brillante. Apoyar tu crecimiento sin frenarte es una de las formas en que te demuestro mi amor.\n\nTu felicidad independiente me causa una alegría enorme. Ver que eres plena, realizada y feliz por ti misma hace que nuestro amor sea una elección diaria basada en el deseo mutuo y no en la necesidad vacía.\n\nAgradezco infinitamente la confianza que depositas en mí. Saber que me consideras tu compañero de vida y tu confidente es el mayor honor que he recibido jamás. Cuidaré esa confianza como la gema más preciada.\n\nSeguiré estando a tu lado en cada proyecto que emprendas, celebrando tus logros y sosteniéndote si las cosas se complican. Mi amor por ti es incondicional y permanente.\n\nTe amo con todo el pensamiento y toda la pasión de mi alma. Eres mi más hermoso presente y mi más deseado futuro.\n\nCon amor infinito,\nTu eterno amor.`,
      `Mi cielo adorado,\n\nCapítulo veinte. Llegar a este punto me llena de emoción. Hemos recorrido un camino hermoso a lo largo de estas entregas, recordando los cimientos, la evolución y la belleza de nuestro amor.\n\nHoy quiero hablarte de la admiración que siento por ti. Admiro tu fuerza ante las dificultades, tu elegancia natural, tu agudeza mental y la inmensa capacidad de dar amor que posees. Eres un ser fuera de serie.\n\nEstar a tu lado ha sido la experiencia más enriquecedora de mi existencia. Me has enseñado a amar sin reservas, a expresar mis sentimientos con libertad y a valorar cada instante precioso de la vida.\n\nMe fascina la paz que siento cuando me acuesto a tu lado y sé que todo está bien. Tu respiración serena es el mejor arrullo para mis noches, la promesa de que al despertar me espera otro día lleno de tu amor.\n\nPrometo seguir reinventándome para sorprenderte, para no permitir que la rutina apague la llama de nuestro entusiasmo. Trabajaré cada día para sacarte esa sonrisa radiante que me enamora.\n\nTe amo más de lo que las palabras pueden expresar en cualquier idioma. Eres la reina indiscutible de mi corazón.\n\nSiempre y sin reservas,\nTu enamorado de siempre.`,
      `Mi amor predilecto,\n\nPenúltimo capítulo, el número veintiuno. La nostalgia y la alegría se entrelazan al escribir estas líneas, sabiendo que este proyecto web llega casi a su cima, pero nuestro amor apenas comienza una nueva etapa renovada.\n\nEstas cartas han sido el canal para inmortalizar la inmensidad de lo que despiertas en mí. Cada palabra cargada de sinceridad ha sido escrita pensando en la calidez de tu sonrisa al leerla.\n\nQuiero darte las gracias por todo lo que me has dado desde el día en que te conocí. Por tu apoyo constante, por tus abrazos curativos, por tus besos apasionados y por la belleza inigualable de tu compañía.\n\nEres la persona con la que quiero envejecer, con quien quiero compartir todas las alegrías y enfrentar todas las vicisitudes que la vida nos presente. Contigo el tiempo es una bendición y el futuro una promesa luminosa.\n\nRecibe esta penúltima carta como un abrazo apretado al corazón. Nunca olvides cuán profundamente eres amada y cuán valiosa eres para mí y para todos los que tienen la dicha de conocerte.\n\nTe amo con un sentimiento indeleble que vivirá por siempre.\n\nTu eterno compañero,\nQuien vive por y para ti.`,
      `Mi amor eterno e infinito,\n\nLlegamos al capítulo veintidós, el capítulo final de esta entrega web, pero el inicio formal de todo lo que nos resta por vivir juntos. Este capítulo es la coronación de una manifestación de amor pensada exclusivamente para ti.\n\nAl mirar atrás y ver cada una de estas cartas, reafirmo con absoluta convicción que amarte es la mejor decisión que he tomado en mi vida. Eres mi compañera ideal, mi gran amor, mi refugio y mi mayor alegría.\n\nNo hay palabras suficientes en ningún diccionario para abarcar la totalidad de este sentimiento. Te amo con tu dulzura, con tus virtudes, con tus manías y con toda la esencia brillante que te compone. Eres perfecta para mí.\n\nPrometo solemnemente seguir amándote con la misma pasión, respeto y devoción todos los días de mi vida. Seguiré cuidando de ti, apoyando tus metas, escuchando tus pensamientos y caminando a tu lado en cada etapa.\n\nGracias por permitirme ser el dueño de tu corazón. Gracias por regalarme tu tiempo, tu amor y tu vida. Prometo estar siempre a la altura de semejante regalo.\n\nEste es el final de estas cartas web, pero el libro de nuestro amor sigue escribiéndose día a día en la vida real, con trazos indelebles de felicidad, paz y comprensión mutua.\n\nTe amo hoy, mañana y por toda la eternidad.\n\nPor siempre tuyo,\nEl amor de tu vida.🤍`
    ];

    document.addEventListener("DOMContentLoaded", () => {
      createFloatingHearts();
      renderChapters();
      
      document.getElementById("closeModal").addEventListener("click", closeModal);
      window.addEventListener("click", (e) => {
        if (e.target === document.getElementById("letterModal")) {
          closeModal();
        }
      });
    });

    function createFloatingHearts() {
      const container = document.getElementById("heartsContainer");
      const heartCount = 20;

      for (let i = 0; i < heartCount; i++) {
        const heart = document.createElement("div");
        heart.classList.add("floating-heart");
        heart.innerText = "🤍";
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${6 + Math.random() * 6}s`;
        heart.style.animationDelay = `${Math.random() * 5}s`;
        heart.style.fontSize = `${15 + Math.random() * 20}px`;
        container.appendChild(heart);
      }
    }

    function renderChapters() {
      const grid = document.getElementById("chaptersGrid");
      grid.innerHTML = "";
      const now = new Date();

      for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
        const card = document.createElement("div");
        card.classList.add("chapter-card");

        let isUnlocked = false;
        let unlockDate = null;

        if (i <= 5) {
          isUnlocked = true;
        } else {
          const daysToAdd = (i - 5) * DAYS_INTERVAL;
          unlockDate = new Date(START_DATE.getTime() + daysToAdd * 24 * 60 * 60 * 1000);
          if (now >= unlockDate) {
            isUnlocked = true;
          }
        }

        if (isUnlocked) {
          card.innerHTML = `
            <div class="card-title">Capítulo ${i}</div>
            <div class="card-status"><span>🤍</span> Desbloqueado</div>
          `;
          card.addEventListener("click", () => openLetter(i));
        } else {
          card.classList.add("locked");
          card.innerHTML = `
            <div class="card-title">Capítulo ${i}</div>
            <div class="card-status">🔒 Bloqueado</div>
            <div class="timer" id="timer-${i}">Calculando...</div>
          `;
          startCountdown(unlockDate, `timer-${i}`);
        }

        grid.appendChild(card);
      }
    }

    function startCountdown(targetDate, elementId) {
      function update() {
        const now = new Date();
        const diff = targetDate - now;
        const el = document.getElementById(elementId);
        if (!el) return;

        if (diff <= 0) {
          renderChapters();
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        el.innerText = `${days}d ${hours}h ${mins}m ${secs}s`;
      }
      update();
      setInterval(update, 1000);
    }

    function openLetter(chapterNumber) {
      const modal = document.getElementById("letterModal");
      const title = document.getElementById("modalTitle");
      const text = document.getElementById("modalText");

      title.innerText = `Capítulo ${chapterNumber}`;
      text.innerText = lettersData[chapterNumber - 1] || "Texto no disponible.";
      modal.classList.add("active");
    }

    function closeModal() {
      const modal = document.getElementById("letterModal");
      modal.classList.remove("active");
    }
  </script>
